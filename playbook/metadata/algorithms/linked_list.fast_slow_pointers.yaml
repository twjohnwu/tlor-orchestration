id: linked_list.fast_slow_pointers
name: Fast / Slow Pointers
category: [linked-list]
aliases: [floyds_cycle_detection, floyd_cycle, has_loop, cycle_detection, middle_element_of_linked_list, tortoise_hare]
signals:
  - linked list cycle
  - cycle start node
  - detect loop
  - middle of linked list
  - O(1) extra space
  - tortoise and hare
  - repeated value functional graph
preconditions:
  single_successor: true
  node_identity: true
  no_mutation_during_walk: true
avoid_when:
  - indexed array                 # -> array.two_pointers
  - multiple successors           # -> graph.traversal.bfs
  - need cycle nodes              # -> visited-set walk (hashing.hash_map)
  - value-equal nodes             # -> visited-set walk (hashing.hash_map)
complexity:
  time: "O(n)"
  space: "O(1)"
related: [array.two_pointers]
confidence: high
review_required: false
