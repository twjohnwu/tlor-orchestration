id: search.binary_search
name: Binary Search
category: [search]
aliases: [binary_search, simple_binary_search, bit_binary_search, bisect, lower_bound, upper_bound]
signals:
  - sorted array
  - find position of value
  - first or last occurrence
  - insertion point
  - lower bound upper bound
  - monotone predicate
  - search on the answer
  - O(log n) lookup
  - logarithmic time
  - log n
  - search space halving
preconditions:
  sorted: true
  random_access: true
  monotone_predicate: true
avoid_when:
  - unsorted array                # -> linear scan
  - unsorted data                 # -> linear scan
  - membership lookup             # -> hash set or map
  - pair target sum          # -> array.two_pointers
  - dynamic min max               # -> heap.priority_queue
  - linked list                   # -> linear scan or balanced tree
  - predicate not monotone        # -> linear scan
complexity:
  time: "O(log n)"
  space: "O(1)"
related: [array.two_pointers, heap.priority_queue]
confidence: high
review_required: false
