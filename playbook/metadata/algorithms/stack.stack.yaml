id: stack.stack
name: Stack
category: [stack]
aliases: [stack, stack_using_array, stack_using_linked_list, balanced_parentheses, postfix_evaluation]
signals:
  - balanced brackets
  - matching parentheses
  - last in first out
  - postfix evaluation
  - undo history
  - innermost first
  - iterative instead of recursion
preconditions:
  input_type: string
  closer_mapping_fixed: true
  pop_only_when_nonempty: true
avoid_when:
  - arrival order   # -> collections.deque queue
  - next greater   # -> stack.monotonic_stack
  - smallest pending   # -> heap
  - fewest steps   # -> graph.traversal.bfs
complexity:
  time: "O(n)"
  space: "O(n)"
related: [stack.monotonic_stack, graph.traversal.dfs]
confidence: high
review_required: false
