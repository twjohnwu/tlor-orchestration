id: array.prefix_sum
name: Prefix Sum
category: [array]
aliases: [prefix_sum, prefix_sums, prefix_2d, cumulative_sum, partial_sum]
signals:
  - range sum query
  - subarray sum
  - cumulative sum
  - many queries static array
  - prefix total
  - sum of rectangle in grid
  - subarray equals target
preconditions:
  integer_elements: true
  static_array: true
  invertible_operation: true
  bounds_inclusive_valid: true
avoid_when:
  - array updates                  # -> Fenwick tree or segment tree
  - min or max                     # -> sparse table or segment tree
  - single range                   # -> plain loop
  - best window                    # -> array.sliding_window
complexity:
  time: "O(n + q)"
  space: "O(n)"
related: [array.sliding_window, hashing.hash_map]
confidence: high
review_required: false
