id: backtracking.backtracking
name: Backtracking
category: [backtracking]
aliases: [backtracking, n_queens, all_permutations, all_combinations, subset_sum, combination_sum, sudoku]
signals:
  - all permutations
  - all subsets
  - all combinations
  - place without conflict
  - combination sum target
  - fill grid constraints
  - list every solution
preconditions:
  size_is_nonnegative_int: true
  bool_rejected: true
  partial_solution_checkable: true
  small_input: true
avoid_when:
  - count only   # -> dp.one_dimensional
  - graph paths   # -> graph.traversal.dfs
  - greedy works   # -> greedy or sorted scan
  - no pruning   # -> itertools generators
complexity:
  time: "O(P * k) with P up to n!/(n-k)!"
  space: "O(k + d) beyond output, d distinct values"
related: [graph.traversal.dfs, dp.one_dimensional]
confidence: high
review_required: false
