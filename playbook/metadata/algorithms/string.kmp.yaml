id: string.kmp
name: KMP String Matching
category: [string, matching]
aliases: [kmp, knuth_morris_pratt, prefix_function, failure_function]
signals:
  - find all occurrences of a substring
  - pattern in text
  - substring search
  - longest prefix suffix
  - pattern occurrences overlapping
  - smallest period
  - overlapping matches
  - substring search linear
preconditions:
  pattern_non_empty: true
  symbols_comparable: true
  single_pattern: true
avoid_when:
  - many patterns        # -> string.trie (Aho-Corasick)
  - small one-off        # -> built-in str.find
  - approximate match    # -> dynamic programming
  - hash acceptable      # -> Rabin-Karp rolling hash
  - only Z-values        # -> Z-algorithm
complexity:
  time: "O(n + m)"
  space: "O(m)"
related: [string.trie]
confidence: high
review_required: false
