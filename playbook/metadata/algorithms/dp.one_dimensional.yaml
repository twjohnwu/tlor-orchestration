id: dp.one_dimensional
name: 1-D Dynamic Programming
category: [dynamic-programming]
aliases: [coin_change, fibonacci, climbing_stairs, house_robber, lis, longest_increasing_subsequence, max_subarray_sum]
signals:
  - minimum number of coins
  - number of ways to climb
  - no two adjacent
  - longest increasing subsequence
  - maximum subarray sum
  - overlapping subproblems
preconditions:
  state_is_single_index: true
  dependencies_point_to_smaller_states: true
  optimal_substructure: true
  coin_values_positive_int: true
  target_non_negative_int: true
avoid_when:
  - two-index state          # -> dp.two_dimensional
  - enumerate all            # -> backtracking.backtracking
  - greedy provable          # -> greedy.interval_scheduling
  - cyclic dependencies      # -> graph.shortest_path.dijkstra
complexity:
  time: "O(n * m)"
  space: "O(n)"
related: [dp.two_dimensional, backtracking.backtracking]
confidence: high
review_required: false
