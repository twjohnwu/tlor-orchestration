# playbook/metadata/algorithms/<id>.yaml — one per entry; build_index.py reads these
id: graph.shortest_path.dijkstra
name: Dijkstra's Algorithm
category: [graph, shortest-path]
aliases: [dijkstra, dijkstras, dijkstra_algorithm, dijkstra_heap, dijkstra_set, dijkstras_shortest_path]
signals:
  - weighted graph
  - shortest path
  - cheapest path
  - non-negative edge weights
  - single source
  - minimum cost to reach
  - network delay
preconditions:
  negative_edges: false
  nan_weights: false
  source_in_graph: true
  neighbours_are_nodes: true
avoid_when:
  - negative edge weights         # -> graph.shortest_path.bellman_ford
  - negative edges                # -> graph.shortest_path.bellman_ford
  - unweighted graph              # -> graph.traversal.bfs
  - equal edge costs              # -> graph.traversal.bfs
  - all-pairs paths      # -> floyd-warshall
  - admissible heuristic          # -> a-star
complexity:
  time: "O((V + E) log V)"
  space: "O(V + E)"
related: [graph.traversal.bfs, graph.shortest_path.bellman_ford, heap.priority_queue]
confidence: high
review_required: false
