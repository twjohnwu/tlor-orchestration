# playbook/metadata/algorithms/<id>.yaml — one per entry; build_index.py reads these
id: graph.shortest_path.bellman_ford
name: Bellman-Ford
category: [graph, shortest-path]
aliases: [bellman_ford, bellman-ford, bellmanford, spfa]
signals:
  - negative edge weights
  - shortest path
  - negative cycle
  - single source
  - detect arbitrage
  - at most k edges
  - difference constraints
preconditions:
  negative_edges: true
  negative_cycle_reachable: false
  nan_weights: false
  source_in_graph: true
  neighbours_are_nodes: true
avoid_when:
  - non-negative weights    # -> graph.shortest_path.dijkstra
  - unweighted graph        # -> graph.traversal.bfs
  - all-pairs paths         # -> floyd-warshall
  - DAG input               # -> graph.topological_sort
complexity:
  time: "O(V * E)"
  space: "O(V + E)"
related: [graph.shortest_path.dijkstra]
confidence: high
review_required: false
