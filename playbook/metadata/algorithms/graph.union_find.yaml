id: graph.union_find
name: Union-Find (DSU)
category: [graph, data-structure]
aliases: [union_find, unionfind, dsu, disjoint_set, dsu_union_rank, dsu_path_compression]
signals:
  - same component
  - connected components
  - merge groups
  - disjoint sets
  - cycle in undirected graph
  - Kruskal spanning tree
  - incremental connectivity
preconditions:
  elements_indexed_0_to_n_minus_1: true
  n_known_upfront: true
  merges_only: true
  directed_graph: false
avoid_when:
  - edge deletions       # -> rollback DSU / offline divide and conquer
  - path needed          # -> graph.traversal.dfs
  - directed reachability  # -> graph.traversal.dfs
  - static graph         # -> graph.traversal.dfs
complexity:
  time: "O(alpha(n)) amortized per operation, O(n) build"
  space: "O(n)"
related: [graph.traversal.dfs]
confidence: high
review_required: false
