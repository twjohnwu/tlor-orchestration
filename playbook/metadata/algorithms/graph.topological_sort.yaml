id: graph.topological_sort
name: Topological Sort
category: [graph, dag]
aliases: [topological_sort, topological_sorting, toposort, topo_sort, kahn, kahns_algorithm]
signals:
  - topological order
  - dependency order
  - prerequisites first
  - build order
  - course schedule
  - detect cycle in directed graph
  - DAG ordering
preconditions:
  adjacency_mapping: true
  directed_graph: true
  successors_are_keys: true
  acyclic: true
avoid_when:
  - undirected graph        # -> graph.traversal.dfs
  - shortest distances      # -> graph.shortest_path.dijkstra
  - cyclic graph            # -> strongly connected components, then sort the condensation
  - smallest-first order    # -> heap-based Kahn (see Variants)
complexity:
  time: "O(V + E)"
  space: "O(V + E)"
related: [graph.traversal.dfs, graph.traversal.bfs]
confidence: high
review_required: false
