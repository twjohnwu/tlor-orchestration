id: graph.traversal.dfs
name: Depth-First Search
category: [graph, traversal]
aliases: [dfs, depth_first_search, depthfirstsearch, depth_first_search_adjacency_list]
signals:
  - reachable from source
  - connected component
  - go as deep as possible
  - depth-first order
  - count reachable nodes
  - detect cycle in graph
  - preorder traversal
preconditions:
  adjacency_mapping: true
  source_is_node: true
  neighbours_are_keys: true
avoid_when:
  - fewest edges            # -> graph.traversal.bfs
  - level order             # -> graph.traversal.bfs
  - dependency ordering     # -> graph.topological_sort
  - enumerate all paths     # -> backtracking.backtracking
  - weighted shortest path  # -> graph.shortest_path.dijkstra
complexity:
  time: "O(V + E)"
  space: "O(V)"
related: [graph.traversal.bfs, graph.topological_sort, backtracking.backtracking]
confidence: high
review_required: false
