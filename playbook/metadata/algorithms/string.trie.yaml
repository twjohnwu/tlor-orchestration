# playbook/metadata/algorithms/<id>.yaml — one per entry; build_index.py reads these
id: string.trie
name: Trie
category: [string, data-structure]
aliases: [trie, trie_tree, trie_modern, prefix_tree]
signals:
  - prefix lookup
  - autocomplete
  - words sharing a prefix
  - starts with
  - dictionary of words
  - insert and delete words
preconditions:
  key_type: str
  case_folding: caller-normalised
  thread_safe: false
avoid_when:
  - exact match only        # -> hashing.hash_map
  - pattern in text         # -> string.kmp
  - sparse few keys         # -> sorted list + binary search
  - tight memory            # -> compressed radix trie
complexity:
  time: "O(L) per operation, L = key length"
  space: "O(total characters)"
related: [hashing.hash_map, string.kmp]
confidence: high
review_required: false
sources:
