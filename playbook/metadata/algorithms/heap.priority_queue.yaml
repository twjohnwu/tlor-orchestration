id: heap.priority_queue
name: Heap / Priority Queue
category: [heap]
aliases: [heap, min_heap, max_heap, binary_heap, binaryheap, priority_queue, priority_queue_using_list]
signals:
  - top k
  - k-th largest
  - k-th smallest
  - extract min
  - priority queue
  - running median
  - merge sorted streams
  - next best item
preconditions:
  items_totally_ordered: true
  pop_only_when_nonempty: true
  no_in_place_mutation: true
avoid_when:
  - sort once   # -> sorted
  - arrival order   # -> collections.deque queue
  - newest first   # -> stack.stack
  - rank queries   # -> balanced tree
  - few levels   # -> bucket queue
complexity:
  time: "push/pop O(log n), peek O(1), build O(n)"
  space: "O(n)"
related: [graph.shortest_path.dijkstra, greedy.interval_scheduling]
confidence: high
review_required: false
