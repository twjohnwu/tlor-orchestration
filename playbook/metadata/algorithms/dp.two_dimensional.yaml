id: dp.two_dimensional
name: 2-D Dynamic Programming
category: [dynamic-programming]
aliases: [knapsack, 0_1_knapsack, lcs, longest_common_subsequence, edit_distance, matrix_chain_multiplication]
signals:
  - longest common subsequence
  - edit distance
  - 0/1 knapsack
  - capacity limit
  - two sequences alignment
  - grid dp
preconditions:
  input_type: sequence
  table_fits_memory: true
avoid_when:
  - single index        # -> dp.one_dimensional
  - fractional items    # -> greedy by ratio
  - huge capacity       # -> meet-in-the-middle
  - subset state        # -> bitmask DP
complexity:
  time: "O(n*m)"
  space: "O(n*m); O(min(n, m)) with a rolling row if the shorter sequence is passed as b"
related: [dp.one_dimensional]
confidence: high
review_required: false
